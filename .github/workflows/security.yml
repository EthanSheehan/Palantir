name: Security

on:
  push:
    branches: [main, worker/**]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 04:30 UTC weekly so dependency CVEs surface even without code change
    - cron: "30 4 * * 0"

permissions:
  contents: read
  security-events: write   # for SARIF upload

jobs:
  # ---------------------------------------------------------------------
  # Python dependency CVE scan
  # ---------------------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit on requirements.txt (advisory)
        run: |
          pip-audit -r requirements.txt --format=sarif --output pip-audit.sarif || true
          pip-audit -r requirements.txt --format=columns || true
      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

  # ---------------------------------------------------------------------
  # Frontend dependency CVE scan
  # ---------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend-react/package-lock.json
      - name: Run npm audit
        working-directory: src/frontend-react
        run: |
          # high+critical block; moderate is advisory.
          npm audit --audit-level=high --json > npm-audit.json || echo "advisory only"
          cat npm-audit.json | head -40 || true
      - name: Upload npm-audit JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: src/frontend-react/npm-audit.json

  # ---------------------------------------------------------------------
  # Static security scan (Bandit)
  # ---------------------------------------------------------------------
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[sarif]"
      - name: Bandit scan
        run: |
          bandit -r src/python/ \
            --skip B101 \
            --severity-level medium \
            --format sarif \
            --output bandit.sarif \
            --exit-zero
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ---------------------------------------------------------------------
  # Secrets scan
  # ---------------------------------------------------------------------
  trufflehog:
    name: trufflehog (secrets)
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ env.DEFAULT_BRANCH }}
          head: HEAD
          extra_args: --only-verified
