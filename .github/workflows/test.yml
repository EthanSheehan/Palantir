name: CI

on:
  push:
    branches: [main, worker/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Python backend — matrix across 3.11 / 3.12 / 3.13
  # ---------------------------------------------------------------------
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pyjwt cryptography hypothesis

      - name: Lint with ruff
        run: ruff check src/python/

      - name: Run tests
        run: |
          pytest src/python/tests/ \
            --ignore=src/python/tests/test_websocket_auth.py \
            --ignore=src/python/tests/test_e2e_integration.py \
            --cov=src/python \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ---------------------------------------------------------------------
  # React frontend — install + typecheck + build
  # ---------------------------------------------------------------------
  frontend:
    name: frontend (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend-react/package-lock.json

      - name: Install
        working-directory: src/frontend-react
        run: npm ci

      - name: Typecheck
        working-directory: src/frontend-react
        run: npx tsc --noEmit

      - name: Lint
        working-directory: src/frontend-react
        run: npx eslint src/ || true

      - name: Build
        working-directory: src/frontend-react
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: src/frontend-react/dist/

  # ---------------------------------------------------------------------
  # AsyncAPI / spec validation
  # ---------------------------------------------------------------------
  contracts:
    name: spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - name: Validate AsyncAPI YAML parses
        run: python -c "import yaml; yaml.safe_load(open('docs/asyncapi.yaml'))"

  # ---------------------------------------------------------------------
  # Aggregate gate — required for branch protection
  # ---------------------------------------------------------------------
  gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, contracts]
    if: always()
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
    steps:
      - name: Aggregate results
        run: |
          if [ "$BACKEND_RESULT" != "success" ] || \
             [ "$FRONTEND_RESULT" != "success" ] || \
             [ "$CONTRACTS_RESULT" != "success" ]; then
            echo "Backend=$BACKEND_RESULT Frontend=$FRONTEND_RESULT Contracts=$CONTRACTS_RESULT"
            exit 1
          fi
          echo "All required jobs passed."
